name: pinpic
description: Search Engine for your Gallery. Local, private, offline-first photo search.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

isar_version: &isar_version 3.3.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1

  isar_community: *isar_version
  isar_community_flutter_libs: *isar_version
  path_provider: ^2.1.5

  photo_manager: ^3.7.1
  permission_handler: ^12.0.1
  image: ^4.5.4

  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: ^0.14.1
  google_mlkit_object_detection: ^0.15.0
  google_mlkit_image_labeling: ^0.14.1

  flutter_animate: ^4.5.2

  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  crypto: ^3.0.6
  collection: ^1.19.1
  intl: ^0.20.2
  share_plus: ^11.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  isar_community_generator: *isar_version

flutter:
  uses-material-design: true
  assets:
    - images/logo.png
    - images/bgcunb/onboarding_search.png
    - images/bgcunb/22.png
    - images/bgcunb/33.png
